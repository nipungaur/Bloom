<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bloom — a garden that grows where you click</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FDF6E8;
    --ink:#2D3142;
    --amber:#F4A259;
    --leaf:#5F9E6F;
    --leaf-dark:#3E7050;
    --dusk:#1B2430;
    --dusk-deep:#10151E;
    --pink:#E8B4BC;

    --sky-a: var(--cream);
    --sky-b: #EAF3E6;
    --ground-a: var(--leaf);
    --ground-b: var(--leaf-dark);
    --text: var(--ink);
    --panel-bg: rgba(253,246,232,0.72);
    --panel-border: rgba(45,49,66,0.12);
    --sun-color: var(--amber);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
    transition: color .8s ease;
  }

  .scene{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 70%);
    transition: background .9s ease;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><circle cx="5" cy="5" r="3" fill="%232D3142" opacity="0.4"/></svg>') 5 5, pointer;
    user-select: none;
  }

  /* ---------- sky bodies ---------- */
  .sun{
    position:absolute;
    top: 9%;
    right: 12%;
    width: 84px;
    height: 84px;
    border-radius:50%;
    background: var(--sun-color);
    box-shadow: 0 0 60px 18px color-mix(in srgb, var(--sun-color) 55%, transparent);
    transition: background 1s ease, box-shadow 1s ease, transform 1.4s cubic-bezier(.4,0,.2,1), width 1s ease, height 1s ease, right 1.4s ease, top 1.4s ease;
  }
  body.night .sun{
    width: 60px; height:60px;
    background: #F1EFE3;
    box-shadow: 0 0 34px 8px rgba(241,239,227,0.35);
    top: 8%; right: 15%;
  }
  .sun::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    background: radial-gradient(circle at 35% 65%, rgba(0,0,0,0.12), transparent 60%);
    opacity:0;
    transition: opacity 1s ease;
  }
  body.night .sun::after{ opacity:1; }

  .stars{ position:absolute; inset:0; opacity:0; transition: opacity 1.2s ease; pointer-events:none; }
  body.night .stars{ opacity:1; }
  .star{
    position:absolute;
    width:2px; height:2px;
    background: #F4F1E4;
    border-radius:50%;
    animation: twinkle 3.4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.25; }
    50%{ opacity:1; }
  }

  .firefly{
    position:absolute;
    width:5px; height:5px;
    border-radius:50%;
    background: #E8FFB0;
    box-shadow: 0 0 8px 3px rgba(232,255,176,0.8);
    opacity:0;
    pointer-events:none;
    animation: drift ease-in-out infinite, glow 2.6s ease-in-out infinite;
  }
  body.night .firefly{ opacity:1; transition: opacity 1.4s ease .3s; }
  @keyframes glow{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }
  @keyframes drift{
    0%   { transform: translate(0,0); }
    25%  { transform: translate(18px,-14px); }
    50%  { transform: translate(-6px,-26px); }
    75%  { transform: translate(-20px,-8px); }
    100% { transform: translate(0,0); }
  }

  /* ---------- ground ---------- */
  .ground{
    position:absolute;
    left:0; right:0; bottom:0;
    height:34%;
    background: linear-gradient(180deg, var(--ground-a) 0%, var(--ground-b) 100%);
    clip-path: ellipse(62% 100% at 50% 100%);
    transition: background 1s ease;
  }
  .ground::before{
    content:"";
    position:absolute; left:0; right:0; top:-1px;
    height:6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent);
  }

  .flowers-layer{
    position:absolute;
    left:0; right:0; bottom:0;
    height:34%;
    overflow:visible;
  }

  .flower{
    position:absolute;
    bottom:0;
    width:34px;
    height:110px;
    transform-origin: 50% 100%;
    transform: scale(.05) translateY(6px);
    opacity:0;
    transition: transform .85s cubic-bezier(.22,1.4,.36,1), opacity .3s ease;
    will-change: transform;
  }
  .flower.grown{ opacity:1; transform: scale(var(--s,1)) translateY(0); }
  .flower.wilt{
    transition: transform .5s cubic-bezier(.5,-0.4,.7,.4), opacity .5s ease;
    transform: scale(calc(var(--s,1) * .05)) translateY(6px) rotate(30deg);
    opacity:0;
  }
  .flower .stem-group{
    transform: rotate(var(--lean, 0deg));
    transition: transform .5s cubic-bezier(.3,.6,.3,1);
    transform-origin: 50% 100%;
  }
  .flower svg{ width:100%; height:100%; display:block; overflow:visible; }

  /* ---------- UI chrome ---------- */
  header{
    position:absolute;
    top: 22px; left: 26px;
    z-index: 5;
    pointer-events:none;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size: clamp(28px, 4vw, 40px);
    margin:0;
    letter-spacing: -0.01em;
    color: var(--text);
    transition: color .8s ease;
  }
  header p{
    margin:4px 0 0;
    font-size:14px;
    color: var(--text);
    opacity:.62;
    max-width: 280px;
    line-height:1.4;
    transition: color .8s ease;
  }

  .count{
    position:absolute;
    top:24px; right:28px;
    font-size:13px;
    color:var(--text);
    opacity:.55;
    font-variant-numeric: tabular-nums;
    text-align:right;
    transition: color .8s ease;
    pointer-events:none;
  }
  .count strong{
    display:block;
    font-family:'Fraunces', serif;
    font-size:26px;
    font-weight:500;
    opacity:1;
    line-height:1.1;
  }

  .toolbar{
    position:absolute;
    left:50%;
    bottom: 22px;
    transform: translateX(-50%);
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    background: var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(20,20,15,0.12);
    z-index: 6;
    transition: background .8s ease, border-color .8s ease;
  }

  .swatches{ display:flex; gap:6px; padding-right:8px; border-right:1px solid var(--panel-border); }
  .swatch{
    width:34px; height:34px;
    border-radius:50%;
    border: 2px solid transparent;
    background:none;
    padding:0;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .2s ease, transform .2s ease;
  }
  .swatch:hover{ transform: translateY(-2px); }
  .swatch.active{ border-color: var(--ink); }
  .swatch svg{ width:22px; height:22px; }

  .btn{
    border:none;
    background: transparent;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    color: var(--text);
    padding:8px 12px;
    border-radius:999px;
    cursor:pointer;
    transition: background .18s ease, color .8s ease;
    white-space:nowrap;
  }
  .btn:hover{ background: rgba(45,49,66,0.08); }
  body.night .btn:hover{ background: rgba(253,246,232,0.12); }

  .hint{
    position:absolute;
    left:50%; bottom:74px;
    transform: translateX(-50%);
    font-size:12px;
    color:var(--text);
    opacity:0;
    transition: opacity .6s ease, color .8s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  .hint.show{ opacity:.55; }

  /* ---------- night palette ---------- */
  body.night{ --text: var(--cream); }
  body.night .scene{ --sky-a: var(--dusk); --sky-b: var(--dusk-deep); --ground-a:#243B2C; --ground-b:#152118; }
  body.night .toolbar{ --panel-bg: rgba(27,36,48,0.66); --panel-border: rgba(253,246,232,0.14); }
  body.night .swatch.active{ border-color: var(--cream); }

  @media (max-width: 520px){
    header{ top:16px; left:16px; }
    header p{ display:none; }
    .count{ top:16px; right:16px; }
    .count strong{ font-size:20px; }
    .toolbar{ gap:6px; padding:7px 9px; bottom:14px; max-width: calc(100vw - 24px); }
    .swatch{ width:30px; height:30px; }
    .btn{ padding:7px 9px; font-size:12px; }
    .hint{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .flower, .stem-group, .sun, .firefly, .star{ animation:none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="sun" id="sun"></div>
  <div class="stars" id="stars"></div>
  <div class="ground"></div>
  <div class="flowers-layer" id="flowersLayer"></div>
</div>

<header>
  <h1>Bloom</h1>
  <p>Click the ground to plant. Move your cursor through the garden to feel the breeze.</p>
</header>

<div class="count" id="count"><strong>0</strong>blooms planted</div>
<div class="hint" id="hint">picked daisy</div>

<div class="toolbar">
  <div class="swatches" id="swatches"></div>
  <button class="btn" id="toggleTheme" type="button">Night</button>
  <button class="btn" id="clearBtn" type="button">Clear garden</button>
</div>

<script>
(function(){
  "use strict";

  const scene = document.getElementById('scene');
  const flowersLayer = document.getElementById('flowersLayer');
  const starsLayer = document.getElementById('stars');
  const countEl = document.getElementById('count');
  const hintEl = document.getElementById('hint');
  const toggleThemeBtn = document.getElementById('toggleTheme');
  const clearBtn = document.getElementById('clearBtn');
  const swatchesEl = document.getElementById('swatches');

  const STORAGE_KEY = 'bloom-garden-v1';

  /* ---------------- flower species ---------------- */
  const SPECIES = {
    daisy: {
      label: 'daisy',
      colors: ['#FDF6E8'],
      center: '#F4A259',
      draw: (petal, center) => `
        <g transform="translate(20,34)">
          ${[0,45,90,135,180,225,270,315].map(a => `
            <ellipse cx="0" cy="-9" rx="4" ry="9" fill="${petal}" transform="rotate(${a})"/>
          `).join('')}
          <circle r="5.5" fill="${center}"/>
        </g>`
    },
    tulip: {
      label: 'tulip',
      colors: ['#E8B4BC', '#F0A0AE', '#E38FA0'],
      center: null,
      draw: (petal) => `
        <g transform="translate(20,30)">
          <path d="M -10 8 C -10 -10 -5 -18 0 -18 C 5 -18 10 -10 10 8 C 6 3 3 6 0 0 C -3 6 -6 3 -10 8 Z" fill="${petal}"/>
        </g>`
    },
    poppy: {
      label: 'poppy',
      colors: ['#D65D5D', '#C94F4F', '#DE6B6B'],
      center: '#2D3142',
      draw: (petal, center) => `
        <g transform="translate(20,32)">
          ${[0,90,180,270].map(a => `
            <path d="M0 0 C 10 -3 12 -12 0 -15 C -12 -12 -10 -3 0 0 Z" fill="${petal}" transform="rotate(${a})" opacity="0.96"/>
          `).join('')}
          <circle r="3.4" fill="${center}"/>
        </g>`
    },
    bluebell: {
      label: 'bluebell',
      colors: ['#7C83FD', '#8D93FF', '#6A72E8'],
      center: null,
      draw: (petal) => `
        <g transform="translate(20,26)">
          ${[-9,3,15].map((dx,i) => `
            <g transform="translate(${dx}, ${i*7})">
              <path d="M0 0 C -6 4 -6 12 0 14 C 6 12 6 4 0 0 Z" fill="${petal}"/>
            </g>
          `).join('')}
        </g>`
    }
  };
  const SPECIES_ORDER = ['daisy','tulip','poppy','bluebell'];

  function stemSvg(species, hue){
    const petal = SPECIES[species].colors[Math.floor(Math.random()*SPECIES[species].colors.length)];
    const center = SPECIES[species].center;
    const bloomMarkup = SPECIES[species].draw(petal, center);
    return `
      <svg viewBox="0 0 40 110" style="filter:hue-rotate(${hue}deg)">
        <path d="M20 108 C 18 80 22 55 20 40" stroke="#3E7050" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M20 76 C 14 74 10 68 8 62" stroke="#3E7050" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M20 60 C 26 58 30 52 31 47" stroke="#3E7050" stroke-width="2" fill="none" stroke-linecap="round"/>
        ${bloomMarkup}
      </svg>`;
  }

  /* ---------------- audio (procedural, no assets) ---------------- */
  let actx = null;
  function ctx(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    return actx;
  }
  function tone(freq, start, dur, type, gain){
    const c = ctx();
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.value = 0;
    osc.connect(g).connect(c.destination);
    const t0 = c.currentTime + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain || 0.06, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function playPlant(){
    const base = 420 + Math.random()*120;
    tone(base, 0, 0.16, 'sine', 0.05);
    tone(base*1.5, 0.05, 0.18, 'triangle', 0.035);
  }
  function playToggle(night){
    if (night){ tone(300,0,0.3,'sine',0.04); tone(220,0.08,0.4,'sine',0.03); }
    else { tone(500,0,0.2,'sine',0.04); tone(700,0.06,0.25,'triangle',0.03); }
  }
  function playClearOne(delay){
    tone(260 - Math.random()*80, delay, 0.22, 'sine', 0.035);
  }

  /* ---------------- state ---------------- */
  let garden = [];      // {id,left,species,hue,scale,bottom}
  let selectedSpecies = 'daisy';
  let isNight = false;
  let idCounter = 0;

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      garden = data.garden || [];
      isNight = !!data.isNight;
      selectedSpecies = data.selectedSpecies || 'daisy';
    }catch(e){ garden = []; }
  }
  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ garden, isNight, selectedSpecies }));
    }catch(e){ /* storage unavailable, fail silently */ }
  }

  /* ---------------- rendering ---------------- */
  function renderFlower(f){
    const el = document.createElement('div');
    el.className = 'flower';
    el.style.left = f.left + '%';
    el.style.bottom = f.bottom + 'px';
    el.style.setProperty('--s', f.scale);
    el.dataset.id = f.id;

    const inner = document.createElement('div');
    inner.className = 'stem-group';
    inner.innerHTML = stemSvg(f.species, f.hue);
    el.appendChild(inner);

    flowersLayer.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('grown')));
    return el;
  }

  function renderAll(){
    flowersLayer.innerHTML = '';
    garden.forEach(renderFlower);
    updateCount();
  }

  function updateCount(){
    countEl.querySelector('strong').textContent = garden.length;
  }

  function buildSwatches(){
    swatchesEl.innerHTML = '';
    SPECIES_ORDER.forEach((key, i) => {
      const s = SPECIES[key];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'swatch' + (key === selectedSpecies ? ' active' : '');
      btn.setAttribute('aria-label', 'Plant ' + s.label);
      btn.dataset.species = key;
      const color = s.colors[0];
      btn.innerHTML = `<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="${color}"/></svg>`;
      btn.addEventListener('click', () => selectSpecies(key, true));
      swatchesEl.appendChild(btn);
    });
  }

  function selectSpecies(key, showHint){
    selectedSpecies = key;
    [...swatchesEl.children].forEach(c => c.classList.toggle('active', c.dataset.species === key));
    if (showHint){
      hintEl.textContent = 'picked ' + SPECIES[key].label;
      hintEl.classList.add('show');
      clearTimeout(selectSpecies._t);
      selectSpecies._t = setTimeout(() => hintEl.classList.remove('show'), 1100);
    }
    save();
  }

  /* ---------------- planting ---------------- */
  function plantAt(clientX, clientY){
    const groundEl = document.querySelector('.ground');
    const rect = groundEl.getBoundingClientRect();
    if (clientY < rect.top - 40) return; // must be near/within ground band

    const leftPct = Math.min(97, Math.max(1, ((clientX - 0) / window.innerWidth) * 100));
    const bottom = Math.max(0, (window.innerHeight - clientY) - (window.innerHeight - rect.bottom));
    const clampedBottom = Math.min(rect.height * 0.7, Math.max(0, clientY < rect.top ? 0 : rect.bottom - clientY - 10));

    const f = {
      id: 'f' + (idCounter++),
      left: leftPct,
      bottom: Math.max(0, Math.min(clampedBottom, rect.height * 0.75)),
      species: selectedSpecies,
      hue: Math.round((Math.random() - 0.5) * 26),
      scale: 0.78 + Math.random() * 0.5
    };
    garden.push(f);
    renderFlower(f);
    updateCount();
    save();
    playPlant();
  }

  scene.addEventListener('click', (e) => {
    if (e.target.closest('.toolbar') || e.target.closest('header')) return;
    plantAt(e.clientX, e.clientY);
  });

  scene.addEventListener('touchend', (e) => {
    if (e.target.closest('.toolbar') || e.target.closest('header')) return;
    const t = e.changedTouches[0];
    if (t) plantAt(t.clientX, t.clientY);
  }, { passive: true });

  /* ---------------- wind / cursor sway ---------------- */
  let mouseX = null;
  scene.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    updateSway();
  });
  scene.addEventListener('mouseleave', () => {
    mouseX = null;
    updateSway();
  });

  function updateSway(){
    const groups = flowersLayer.querySelectorAll('.flower .stem-group');
    groups.forEach(g => {
      const parent = g.parentElement;
      const rect = parent.getBoundingClientRect();
      const flowerX = rect.left + rect.width / 2;
      if (mouseX === null){
        g.style.setProperty('--lean', '0deg');
        return;
      }
      const dx = flowerX - mouseX;
      const dist = Math.abs(dx);
      const influence = Math.max(0, 1 - dist / 260);
      const lean = Math.sign(dx) * influence * 14;
      g.style.setProperty('--lean', lean.toFixed(1) + 'deg');
    });
  }
  // gentle idle breeze even without cursor interaction
  let breezeT = 0;
  function idleBreeze(){
    breezeT += 0.015;
    if (mouseX === null){
      const groups = flowersLayer.querySelectorAll('.flower .stem-group');
      groups.forEach((g, i) => {
        const wobble = Math.sin(breezeT + i * 0.6) * 3.2;
        g.style.setProperty('--lean', wobble.toFixed(1) + 'deg');
      });
    }
    requestAnimationFrame(idleBreeze);
  }
  requestAnimationFrame(idleBreeze);

  /* ---------------- day / night ---------------- */
  function applyTheme(){
    document.body.classList.toggle('night', isNight);
    toggleThemeBtn.textContent = isNight ? 'Day' : 'Night';
  }

  function buildStars(){
    starsLayer.innerHTML = '';
    for (let i = 0; i < 70; i++){
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 62 + '%';
      s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
      starsLayer.appendChild(s);
    }
  }

  function buildFireflies(){
    document.querySelectorAll('.firefly').forEach(f => f.remove());
    for (let i = 0; i < 14; i++){
      const f = document.createElement('div');
      f.className = 'firefly';
      f.style.left = (5 + Math.random() * 90) + '%';
      f.style.top = (48 + Math.random() * 42) + '%';
      f.style.animationDuration = (4 + Math.random() * 3).toFixed(2) + 's, ' + (2 + Math.random()*1.5).toFixed(2) + 's';
      f.style.animationDelay = (Math.random() * 2).toFixed(2) + 's';
      scene.appendChild(f);
    }
  }

  toggleThemeBtn.addEventListener('click', () => {
    isNight = !isNight;
    applyTheme();
    playToggle(isNight);
    save();
  });

  /* ---------------- clear garden ---------------- */
  clearBtn.addEventListener('click', () => {
    if (!garden.length) return;
    const els = [...flowersLayer.querySelectorAll('.flower')];
    els.forEach((el, i) => {
      setTimeout(() => {
        el.classList.remove('grown');
        el.classList.add('wilt');
        playClearOne(0);
      }, i * 35);
    });
    setTimeout(() => {
      garden = [];
      updateCount();
      save();
      renderAll();
    }, els.length * 35 + 550);
  });

  /* ---------------- keyboard shortcuts ---------------- */
  window.addEventListener('keydown', (e) => {
    const map = { '1':'daisy', '2':'tulip', '3':'poppy', '4':'bluebell' };
    if (map[e.key]){ selectSpecies(map[e.key], true); }
    if (e.key.toLowerCase() === 'n'){ toggleThemeBtn.click(); }
  });

  /* ---------------- resize keeps stars sane ---------------- */
  window.addEventListener('resize', updateSway);

  /* ---------------- init ---------------- */
  load();
  buildSwatches();
  applyTheme();
  buildStars();
  buildFireflies();
  renderAll();
  selectSpecies(selectedSpecies, false);

})();
</script>

</body>
</html>
